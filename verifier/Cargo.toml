[package]
name = "verifier"
version = "0.1.0"
edition = "2021"

[dependencies]
risc0-groth16 = "3.0.3"  # Note: risc0-zkvm 3.0.4 requires ^3.0.3, so 3.0.2 is not compatible
risc0-zkvm = { version = "3.0.4" }
risc0-zkp = { version = "3.0.3" }
bincode = "1.3"
hex = "0.4"
clap = { version = "4.5.8", features = ["derive"] }
json = "0.12.4"
serde = "1.0"
serde_json = "1.0"
zk-result = { path = "../zk-result" }
sha2 = "0.10.8"
ark-groth16 = { version = "0.4", default-features = false }
ark-bn254 = { version = "0.4" }
ark-ff = "0.4"
ark-serialize = "0.4"
num-bigint = "0.4.6"