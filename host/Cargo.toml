[package]
name = "host"
version = "0.1.0"
edition = "2021"

[dependencies]
risc0-zkvm = { version = "3.0.4", features = ["prove"] }
methods = { path = "../methods" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = "1.0"
serde_json = "1.0"
bincode = "1.3"
hex = "0.4"
clap = { version = "4.5.8", features = ["derive"] }
cli_serde = { path = "../cli_serde" }
zk-result = { path = "../zk-result" }